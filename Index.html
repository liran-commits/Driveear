<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Perfect Pitch Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12130f;
    --panel: #1a1b15;
    --line: #2a2b22;
    --amber: #e8a33d;
    --amber-dim: #8a6224;
    --good: #5fa88b;
    --bad: #c4574a;
    --text: #ede8de;
    --text-dim: #8f8b7c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% -10%, #1c1d16 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    min-height:100vh;
    padding: env(safe-area-inset-top,20px) 20px calc(env(safe-area-inset-bottom,20px) + 16px);
    overflow:hidden;
  }
  .top{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:14px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .top .brand{color:var(--amber); font-weight:700;}
  .top .stat span{color:var(--text);}

  .dial-wrap{
    position:relative;
    width:min(78vw,300px);
    height:min(78vw,300px);
    margin-top:6vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  svg.ring{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg);}
  svg.ring circle.track{fill:none; stroke:var(--line); stroke-width:6;}
